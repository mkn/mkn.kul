#! clean build -dtKOp test run -p test,usage -W 9

name: mkn.kul

parent: include

profile:
- name: include
  inc: ./inc

- name: _test
  parent: include
  inc: .
  mode: none
  dep: google.test
  if_arg:
    win_shared: -DGTEST_LINKED_AS_SHARED_LIBRARY=1

- name: test
  parent: _test
  main: tst/test.cpp
  src: tst/test
  mode: none

- name: bench
  parent: include
  main: tst/bench/bench.cpp
  dep: google.benchmark

- name: usage
  parent: include
  main: tst/usage.cpp

- name: format
  mod: |
    clang.format{init{style: file, types: hpp cpp ipp, paths: .}}

- name: clang.tidy
  parent: _test
  src: tst
  main: tst/usage.cpp
  dep: parse.yaml
  mod:
  - name: clang.tidy
    version: master
    init:
      args: -std=c++20
