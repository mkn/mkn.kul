#! clean build run -dtKOp test,usage -W 9

name: mkn.kul
version: master  # on the latest branch a release, e.g. 0.2.0: merged there it is tagged and published
property:
  # dependency versions, only here: master on master, latest on the latest branch, releases pinned in tags
  parse.yaml.version: master
  clang.tidy.version: master
  cpp.iwyu.version: master

parent: include

profile:
- name: include
  inc: ./inc

- name: _test
  parent: include
  inc: .
  mode: none
  dep: google.test
  if_arg:
    win_shared: -DGTEST_LINKED_AS_SHARED_LIBRARY=1

- name: test
  parent: _test
  main: tst/test.cpp
  src: tst/test
  mode: none

- name: test_bon
  parent: _test
  main: tst/test_yaml/bon.cpp
  dep: parse.yaml#${parse.yaml.version}

- name: bench
  parent: include
  main: tst/bench/bench.cpp
  dep: google.benchmark

- name: usage
  parent: include
  main: tst/usage.cpp

- name: format
  mod: |
    clang.format#master{init{style: file, types: hpp cpp ipp, paths: .}}

# include-what-you-use report for inc/, needs iwyu on PATH, see res/iwyu.imp
- name: iwyu
  parent: usage
  dep: parse.yaml#${parse.yaml.version}[headers]
  mod:
  - name: cpp.iwyu
    version: ${cpp.iwyu.version}
    compile:
      paths: inc
      # os/win os/bsd: other platforms, the rest are fragments of a parent header
      ignore: os/win os/bsd os.top os.bot cli.os math/blas math/noblas os/def.hpp
      headers: -x c++-header
      args: -Xiwyu --mapping_file=res/iwyu.imp

# iwyu's suggestions applied (fix_include): CI builds this and fails on any resulting diff
- name: iwyu_fix
  parent: usage
  dep: parse.yaml#${parse.yaml.version}[headers]
  mod:
  - name: cpp.iwyu
    version: ${cpp.iwyu.version}
    compile:
      paths: inc
      # os/win os/bsd: other platforms, the rest are fragments of a parent header
      ignore: os/win os/bsd os.top os.bot cli.os math/blas math/noblas os/def.hpp
      headers: -x c++-header
      args: -Xiwyu --mapping_file=res/iwyu.imp
      # --noreorder keeps the include order (kul, other, system), --nosafe_headers lets it
      # remove unused includes from headers too
      fix: --nocomments --noreorder --nosafe_headers
      system_last: true

- name: clang.tidy
  parent: _test
  src: tst
  main: tst/usage.cpp
  dep: parse.yaml#${parse.yaml.version}
  mod:
  - name: clang.tidy
    version: ${clang.tidy.version}
    init:
      args: -std=c++20
